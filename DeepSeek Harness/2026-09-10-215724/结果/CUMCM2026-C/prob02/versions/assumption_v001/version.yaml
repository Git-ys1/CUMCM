  的 0:00 预报与同日实际的小时级相对 L1 误差均值 14.89%（365 天），4 个交付日期（2025-03-20 / 06-21 / 09-23 /
  12-21）的预报-实际光伏差（正缺口）分别约 6 059 / 3 618 / 3 343 / 2 007 kWh；全年有 163 天实际净负荷高于预报净负荷。computation
  必须给出逐日 u 总量、发生时段与次数，以及 4 个指定日期的表 3 数值；若某日 u=0 须显式登记为 0 而非留空。
- I2（agent_inference，待 computation 证实）：334 个独立的 144 时段 MILP（每个含 144 个 0-1）+ 334 次第二阶段缺口评估，规模与
  prob01 同量级，精确求解应可行；须以 solver status、best bound 与主问题的 mip_gap 证实。若超时或 gap 缺失，按 PASS_WITH_WARNING
  保留技术债说明，不得直接人工阻塞。
- I3（口径推断，待 formulation/sanity 检查）：「按计划购电量计算」使 q_dt 成为结算量；计划偏保守（多买）与偏激进（少买）具有不对称成本（1×
  vs 5×）。formulation 必须显式写出计划量结算式，sanity 必须核对 result2.xlsx 的「全天购电费」与 Σ price_t·q_dt
  一致，禁止实现静默改成按实际取用量计费。
- I4（待 computation 报告）：实际光伏高于预报的时段会出现弃光（附件2 全年 330 天存在单时段正余电，最大单时段余电 6 602.0 kW），实际光伏低于预报的时段（按预报充电/放电的计划被执行）会出现紧急购电；两者都必须按段报告时段与原因。
- I5（待 formulation 固定）：「预报 k 小时」与区间的对应关系（第 k 个整点小时区间）、同日对齐的核验（探针已给出同日/次日/前日相对误差 14.89%/16.53%/16.49%，支持同日对齐），以及将整点预报展开到
  10 分钟时段的规则；该口径错误会系统性改变 q_dt 与 u_dt。
decision_reason: assumption_v001 覆盖 prob02 全部待裁定歧义（A2/A3/A4/A5/A9/A10/A11/A13/A14）：10
  条关键假设均绑定本问 verified+used 来源，引用门禁 check_key_assumptions 实测通过；A3 固定为「负载已知 + 0:00 光伏预报
  → 实际由附件2 实现」的两阶段口径，使题面要求的紧急购电机制非平凡，并把完全信息（u≡0）与典型日预测两种反面口径登记为 alt-01/alt-02 对照；A2
  取日循环 6000 kWh 以闭合边界并保持 334 天可解；无阻塞冲突，取值与口径选择一律显式标为 project_assumption/problem_statement，未伪装成文献事实。

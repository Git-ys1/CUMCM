assumptions:
- id: asm-01
  title: 两阶段「0:00 计划—实际补救」主框架
  statement: 问题2按两阶段结构建模：第一阶段在每天 0:00 用当时可获得的信息确定当日计划购电量 q_dt 与储能充放电计划 (C_dt, D_dt,
    E_dt)；第二阶段按当日实际负载与实际光伏执行该计划，若微网提供的电能低于小区负载，则缺口按交易时刻电价的 alpha_em=5 倍紧急购电。目标是全年（334
    天）总购电费用最小。
  category: 建模框架
  key: true
  evidence_type: literature_fact
  reference_ids:
  - ref-prob02-trading-morales-2010
  - ref-prob02-loadshed-zeinalzadeh-2017
  - ref-prob02-dayaheadintraday-xie-2021
  - ref-prob02-twostage-ma-2022
  evidence: F5：日前计划与实时/日内补救属不同信息结构的两阶段问题，可写为线性/两阶段优化（Morales 2010、Xie 2021 摘要级；Ma
    2022 题录级，仅框架先例）；F3：微网可先确定向主网的净负荷/购电轨迹，实际不足用未供电变量刻画，储能用于降低未供电与弃光风险（Zeinalzadeh
    2017 摘要级；本题把切负荷改为付费紧急购电）。
  applicability: 单一微网、单一储能、单一外网结算通道；0:00 一次决策，当日不再调整（问题3 才引入调整与偏差结算）。
  bias_direction: 若实际运营中允许日内滚动修订计划，两阶段解会高估紧急购电与购电费；若实际信息比本版本假设更差（如负载也需预测），则低估紧急购电。
  affected_symbols:
  - q_dt
  - C_dt
  - D_dt
  - E_dt
  - u_dt
  - Cost_plan
  - Cost_em
  validation_method: formulation 显式写出两阶段的决策时点与信息集；computation 分别报告计划量、实际执行量、逐日紧急购电总量与次数；sanity
    检查两阶段口径是否被静默改成单阶段完全信息。
  status: accepted
- id: asm-02
  title: 0:00 计划的信息集：当日负载已知 + 当日 0:00 光伏预报（A3）
  statement: 0:00 制定当日计划时：当日小区负载（附件2「小区负载」）视为已知的刚性需求；光伏发电功率取当日 0:00 发布的未来 24 小时整点预报（附件3），展开到
    10 分钟时段后作为计划依据。当日实际光伏取附件2「光伏发电实际功率」。附件1 只提供逐日相同的电价曲线，不作为本问的光伏计划依据。因此计划依据的 (load,
    pv_forecast) 与实际实现的 (load, pv_actual) 在光伏项上可以不同。
  category: 决策偏好与信息结构
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-voi-chazarra-2016
  - ref-prob02-pvforecast-mayer-2021
  - ref-prob02-imbalance-bottieau-2020
  evidence: F7：光伏功率预测存在可观的模型间误差，预测值不等同于实际值（Mayer 2021 摘要级）；F5/F6：完美信息价值可量化、日前与实时属不同信息结构（Chazarra
    2016 摘要级）；F2：偏差的方向与结算价格必须分别定义（Bottieau 2020 摘要级）。题面问题3 明示「在每天 0:00、6:00、12:00
    和 18:00 可获得未来 24 小时整点的光伏发电功率预报」，即 0:00 预报是既有的信息条件；物理上 0:00 亦无法预知当日实际光伏。
  applicability: 问题2（以及问题4-2 的波动电价重算）；计划与实际的差异只来自光伏预报误差，负载视为已知。
  bias_direction: 若实际采用完全信息（计划依据附件2 实际光伏），则紧急购电恒为 0、全年费用更低（见 alt-01）；若计划改用附件1 的年度日均预测，则逐日偏差被系统性放大（探针
    L1 误差均值约 11 056 kWh/日，见 alt-02）。
  affected_symbols:
  - q_dt
  - pvfc_dhk
  - pv_dt
  - u_dt
  - Cost_plan
  - Cost_em
  validation_method: formulation 必须显式声明 0:00 信息集与「预报 k 小时→区间」的展开规则；computation 报告附件3
    0:00 预报与附件2 实际的偏差统计（探针：365 天同日对齐的小时级相对 L1 误差均值 14.89%，优于次日/前日对齐的 16.53%/16.49%，证实同日对齐）；robustness
    对照 alt-01（完全信息）与 alt-02（典型日预测口径）。
  status: accepted
  boundary_note: 题面问题2 的数据清单只列「附件1 的电价和附件2 的数据」，未列附件3；本版本把 0:00 预报纳入计划信息集属口径选择，已在
    alt-01/alt-02 与本文第 3、6 节登记对照，论文与交付必须显式声明，不得静默采用。
- id: asm-03
  title: 供电充足判定与紧急购电口径（A11，只罚不足方向）
  statement: 逐 10 分钟时段按四源平衡判定供电是否充足：q_dt + u_dt + pv_actual_dt·dt + D_dt − C_dt −
    curtail_dt ≥ load_dt·dt，其中 u_dt ≥ 0 为紧急购电量；缺口 u_dt = max(0, load_dt·dt + C_dt
    + curtail_dt − q_dt − pv_actual_dt·dt − D_dt) 按 5×max(price_t) 结算。只对「供电不足」方向计惩罚，计划量超出实际需求的方向不额外罚款（只按计划电价付费）。
  category: 边界条件与结算口径
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-balancing-vanderveen-2016
  - ref-prob02-imbalance-bottieau-2020
  - ref-prob02-marketdesign-hu-2018
  evidence: F1：电力平衡市场处理日前承诺与实际供需的偏差，偏差的结算规则与惩罚强度是市场设计的核心变量（van der Veen 2016、Hu 2018
    摘要级）；F2：偏差有正负两个方向，结算规则决定参与者激励（Bottieau 2020 摘要级）。题面硬约束给出「不可低于负载」与「5 倍电价」，属题面给定，不属文献结论。
  applicability: 问题2 全时段；紧急购电为目标中的惩罚性补救量，不得预设为恒 0，也不得与计划量重复计入供电。
  bias_direction: 若实际结算对正偏差也计费（如违约电价），本模型会低估费用；反之若紧急电价低于 5 倍，则低估紧急购电的规避动机。
  affected_symbols:
  - u_dt
  - alpha_em
  - price_t
  - load_dt
  - pv_dt
  - Cost_em
  validation_method: computation 报告逐日紧急购电总量、发生时段与次数；sanity 独立回代四源平衡残差、检查 u ≥ 0 与 u
    的计费单价恰为 5×price_t；robustness 对照 alt-01（完全信息下 u 应恒为 0）。
  status: accepted
- id: asm-04
  title: 计划量的结算口径：按计划购电量计费（I3）
  statement: 计划购电量 q_dt 是结算量而非实际取用量：无论实际取了多少，均按 q_dt 与 price_t 结算计划购电费；计划量高于实际需求的部分不退费，计划量低于实际需求的部分由
    u_dt 以 5 倍电价补足。总费用 = Σ(Cost_plan + Cost_em)。
  category: 结算与计费口径
  key: true
  evidence_type: problem_statement
  reference_ids:
  - ref-prob02-balancing-vanderveen-2016
  - ref-prob02-marketdesign-hu-2018
  evidence: 题面明文：「除紧急购电费用外，其他时间段的购电费用均按计划购电量计算」；F1/F4 提供「日前承诺量 + 偏差惩罚性结算」的机制定位（van
    der Veen 2016、Hu 2018 摘要级）。计费基数取计划量是题面规定，不属文献结论。
  applicability: 问题2 的计划购电量与费用统计、表 1/表 2 的「全天购电量」「全天购电费」口径。
  bias_direction: 若实际按取用量计费，则计划偏保守（多买）不产生额外成本，紧急购电的规避动机会更强；本口径使「计划偏保守/偏激进」具有不对称经济后果。
  affected_symbols:
  - q_dt
  - Cost_plan
  - Q_day
  - Cost_day
  validation_method: formulation 显式写出计划量结算式并在交付中区分「计划量」与「实际取用量」；sanity 检查 C_plan =
    Σ price_t·q_dt 与 result2.xlsx「全天购电费」口径一致，禁止实现静默改成按实际取用量计费。
  status: accepted
- id: asm-05
  title: 目标函数与求解组织：全年总费用最小、日循环下逐日独立 MILP
  statement: 目标为全年（334 天）总购电费用最小，即 min Σ_d Σ_t (price_t·q_dt + 5·price_t·u_dt)；在 asm-06
    的日循环边界下，334 天互不耦合，等价于对每天独立求解一个 144 时段 MILP 后求和。
  category: 建模框架与求解策略
  key: true
  evidence_type: literature_fact
  reference_ids:
  - ref-prob02-centralized-tsikalakis-2008
  - ref-prob02-ems-espin-2020
  - ref-prob02-storagevalue-sioshansi-2009
  evidence: F9：集中式 EMS/中央控制器是微网调度的主流架构，并网模式下与主网的功率交换以经济性为目标优化（Tsikalakis 2008、Espin-Sarzosa
    2020 摘要级）；Sioshansi 2009（题录级）为「按全年逐时段评估储能运行价值」提供口径先例。逐日解耦是日循环边界的数学结果，不依赖文献。
  applicability: 问题2 的 334 天；若改用连续跨日边界（alt-03），则日间耦合、需整体长时段模型或分解。
  bias_direction: 逐日独立最优在全年代价上等价于整体最优（日循环下可分离）；若边界实为连续，则逐日独立性会低估可跨日转移的能量价值。
  affected_symbols:
  - d
  - D
  - q_dt
  - u_dt
  - Cost_plan
  - Cost_em
  validation_method: formulation 给出可分离性说明；computation 报告逐日 solver status/best bound/gap
    与全年费用汇总；robustness 对照 alt-03（连续跨日）。
  status: accepted
- id: asm-06
  title: 跨日储能边界取日循环：E_d,0 = E_d,144 = 6000 kWh（A2/A10）
  statement: 每一天的计划与实际执行均满足 E_d,0 = E_d,144 = 6000 kWh（334 天取同一日循环水平），其中 6000 kWh
    取自附录1「2025 年 1 月 1 日 0:00 的电量为 6000 kWh」；跨日不做连续传递，即昨日 24:00 储电量不直接作为今日 0:00 初值。
  category: 边界条件
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-voi-chazarra-2016
  - ref-prob02-bessmodels-rosewater-2019
  - ref-prob02-terminal-han-2025
  evidence: F6：日循环（daily-cycle）边界是储能调度的常见设定（Chazarra 2016 摘要级）；SOC 递推、效率与边界条件是 BESS
    最优控制模型的核心要素，边界处理会显著影响结果（Rosewater 2019 摘要级；Han 2025 题录级）。题面问题1 明写「储能设备在 0:00 和
    24:00 的储电量相同」，问题2 未重复该条件，但表 2 仍逐日交付 0:00 与 24:00 储电量；共同取值 6000 来自附录1，不来自文献。
  applicability: 问题2 全部 334 天；交付范围 2025-02-01~12-31。
  bias_direction: 若实际为连续跨日，日循环会切断跨日能量转移：在 PV 富余日高估弃光、在 PV 亏缺日高估紧急购电；共同取值偏离 6000 会按峰谷价差方向改变费用。
  affected_symbols:
  - E0
  - E_dt
  - Emin
  - Emax
  - C_dt
  - D_dt
  - u_dt
  - Cost_em
  validation_method: sanity 检查逐日 E_d,0 与 E_d,144 残差均等于 6000 且逐时段落在 [1200, 10800]；robustness
    对照 alt-03（连续跨日，1 月为预热期）与日循环水平 E^cyc ∈ {4800, 6000, 7200} 的费用方向与幅度。
  status: accepted
- id: asm-07
  title: 计划执行口径：储能按 0:00 计划执行，紧急购电是唯一补救手段
  statement: 问题2 的第二阶段按已定计划执行储能充放电 (C_dt, D_dt)（储能不按实际光伏重新调度）；实际负载与实际光伏实现后，若按计划执行的供电仍低于负载，缺口只能由紧急购电
    u_dt 补足；若实际光伏高于预报，超出部分（扣减计划充电后）以弃光处理。
  category: 行为规则与执行口径
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-loadshed-zeinalzadeh-2017
  - ref-prob02-ems-espin-2020
  - ref-prob02-centralized-tsikalakis-2008
  evidence: 题面问题2 只给出「制定当天的计划购电策略」，未提供任何日内调整机制；问题3 才引入「根据其他时刻的预报调整购电策略」，故本问的执行层按计划执行。F3：微网按给定的净负荷轨迹执行、实际不足用未供电变量刻画（Zeinalzadeh
    2017 摘要级）；F9：集中式 EMS 以日前计划驱动运行（Espin-Sarzosa 2020、Tsikalakis 2008 摘要级）。
  applicability: 问题2；问题3 引入调整机制后本口径失效（由该问假设覆盖）。
  bias_direction: 不允许储能按实际光伏再调度会放大紧急购电量；若允许实时再调度（alt-06），紧急购电会下降（幅度由 ablation 量化）。
  affected_symbols:
  - C_dt
  - D_dt
  - E_dt
  - u_dt
  - curtail_t
  - Cost_em
  validation_method: formulation 明确写「计划层 / 执行层」两套变量与执行规则；computation 分别报告计划充放电量与实际执行的缺口；ablation
    用 alt-06（实际数据下重新调度储能、计划购电量不变）量化储能灵活性对紧急购电的削减。
  status: accepted
- id: asm-08
  title: 余电以弃光处理，不向外部电网反送（A4，继承 prob01 asm-03）
  statement: 当光伏出力与放电之和超过负载与充电需求时，超出部分记为弃光 curtail_dt ≥ 0（零收益），不建模向外网售电或反送。
  category: 边界条件
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-loadshed-zeinalzadeh-2017
  - ref-prob02-bessmodels-rosewater-2019
  evidence: 题面与附件均未提供上网电价或反送计量要求；F3 表明弃光是微网调度中的常规建模手段（Zeinalzadeh 2017 摘要级）；Rosewater
    2019（摘要级）说明 SOC/功率边界与盈余处理必须显式建模。继承 prob01 assumption_v001 的 asm-03（同一设备与同一并网口径）。
  applicability: 问题2 全部时段与全部 334 天；附件2 全年有 330 天存在单时段正余电（探针：最大单时段余电 6 602.0 kW），弃光量预计显著非零。
  bias_direction: 若实际存在正上网电价，本模型会低估收益、高估购电费；零收益假设下偏差可忽略。
  affected_symbols:
  - curtail_t
  - q_dt
  - C_dt
  - D_dt
  validation_method: computation 报告全年弃光总量、发生时段与原因（SOC 达上界或单时段功率受限）；robustness 对照「允许零收益反送」并验证总费用不变（alt-04）。
  status: inherited
  inherited_from: prob01/assumption_v001/asm-03
- id: asm-09
  title: 效率与功率口径：单向 90%、833.33 kWh/10min、并网点侧计量（A14，继承 prob01 asm-04/asm-05）
  statement: 附录1 的「充放电效率 90%」解释为充电、放电各 0.90（往返约 0.81），效率作用于储电量状态转移；5000 kW 为充/放电功率上限，折算为每
    10 分钟能量上限 5000/6 ≈ 833.33 kWh；C_dt 与 D_dt 统一取并网点侧电量口径，限额、状态转移与功率平衡使用同一口径。
  category: 机理简化与单位口径
  key: true
  evidence_type: project_assumption
  reference_ids:
  - ref-prob02-bessmodels-rosewater-2019
  - ref-prob02-milpdegr-minh-2024
  evidence: Rosewater 2019（A/摘要级）指出 SOC 递推、效率与边界条件是 BESS 最优控制模型的核心要素，建模选择会显著影响结果；Minh
    2024（题录级）只作 MILP 框架先例。附录1 只写「效率 90%」与「5000 kW」，单侧/往返与计量侧题面未指明，属 project_assumption。继承
    prob01 assumption_v001 的 asm-04 与 asm-05。
  applicability: 问题2 全部时段；恒定效率，与功率、温度、SOC 无关；10 分钟均匀离散。
  bias_direction: 若 90% 实为往返效率（单侧 0.9487），当前口径高估损耗、使费用偏高；若 5000 kW 实为电池侧口径而按并网点侧解释，则可行域被高估约
    1/eta。
  affected_symbols:
  - eta_ch
  - eta_dis
  - Pmax
  - C_dt
  - D_dt
  - E_dt
  validation_method: sanity 检查 0 ≤ C_dt, D_dt ≤ 833.33、SOC 递推残差与量纲一致性；robustness 沿用
    prob01 的口径对照（往返 0.9 与电池侧计量）并报告费用差异方向上是否与 prob01 一致。
  status: inherited
  inherited_from: prob01/assumption_v001/asm-04, prob01/assumption_v001/asm-05
- id: asm-10
  title: 充放电互斥（C_dt·D_dt = 0，继承 prob01 asm-06）
  statement: 同一时段不允许同时充电与放电，以 0-1 指示变量与 big-M（M = 833.33，由题面功率上限导出）作为硬约束进入模型。
  category: 物理约束
  key: true
  evidence_type: literature_fact
  reference_ids:
  - ref-prob02-bessmodels-rosewater-2019
  - ref-prob02-milpdegr-minh-2024

    alt-01）。
  - asm-03（缺口判定）× asm-04（结算口径）必须分别实现：缺口按实际数据判定，费用按计划量 + 紧急量结算；不得把 u 计入 q 或反过来。
  - asm-06（日循环）× asm-16（交付范围）一致：日循环水平取 6000 kWh，334 天同值，1 月不进入交付。
  - asm-09（效率/计量侧）× asm-06（SOC 递推）必须同口径：并网点侧计量下 E_dt = E_d,t-1 + eta_ch·C_dt − D_dt/eta_dis，功率平衡中
    D_dt 直接参与；两条口径不得混用。
  - asm-08（弃光）× asm-12（时段离散）：弃光在 10 分钟粒度判定，交付时按 4 小时块汇总。
  - asm-05（逐日独立）× asm-06（日循环）：逐日独立最优在日循环下等价于全年最优，不得据此省略「全年费用汇总」与逐日 traceability。

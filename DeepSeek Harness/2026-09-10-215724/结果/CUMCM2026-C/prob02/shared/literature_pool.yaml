  abstract: 解绑后的欧洲国家电力市场中，平衡市场是处理电力供需平衡的制度安排。本文给出识别平衡市场设计变量与性能标准的框架，讨论性能标准之间的权衡、设计变量的不确定效应，以及平衡市场与整体电力市场之间的多重关联。

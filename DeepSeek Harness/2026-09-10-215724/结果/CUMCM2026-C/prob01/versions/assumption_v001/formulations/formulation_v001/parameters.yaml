problem_id: CUMCM2026-C
question_id: prob01
formulation_version: formulation_v001
assumption_version: assumption_v001
model_id: M1_dayahead_milp
title: 固定电价/负载下的单日（代表日）计划购电 MILP

sets:
  - name: T_set
    symbol: t
    description: 10 分钟时段索引
    domain: "t = 1..144"
    period_definition: "时段 t 覆盖区间 ((t-1)/6 h, t/6 h]，t=144 即当天 24:00"
  - name: T_zero
    symbol: t=0
    description: 当天 0:00 初始时刻（初始状态）
    domain: "t = 0"
  - name: blocks
    symbol: T_b
    description: 表 2 的 6 个 4 小时块
    domain: "b = 1..6; T_1=1..24, T_2=25..48, T_3=49..72, T_4=73..96, T_5=97..120, T_6=121..144"

parameters:
  - symbol: dt
    name: 调度时段长度
    value: 0.16666666666666666
    unit: h
    expression: "1/6"
    source: "global_symbols.yaml; asm-09"
  - symbol: T
    name: 每日时段数
    value: 144
    unit: "个"
    source: "global_symbols.yaml; asm-09"
  - symbol: Ecap
    name: 储能最大容量
    value: 12000
    unit: kWh
    source: "附录 1"
  - symbol: Emin
    name: 储电量运行下界
    value: 1200
    unit: kWh
    source: "附录 1; asm-08"
  - symbol: Emax
    name: 储电量运行上界（防过充）
    value: 10800
    unit: kWh
    source: "附录 1; asm-08"
  - symbol: Pmax
    name: 最大充放电功率
    value: 5000
    unit: kW
    source: "附录 1"
  - symbol: eta_ch
    name: 充电效率
    value: 0.9
    unit: "-"
    source: "附录 1; asm-04（单向效率口径）"
  - symbol: eta_dis
    name: 放电效率
    value: 0.9
    unit: "-"
    source: "附录 1; asm-04（单向效率口径）"
  - symbol: E0
    name: 初始储电量（0:00）
    value: 6000
    unit: kWh
    source: "附录 1; asm-02"
  - symbol: price_t
    name: 时段 t 电价
    unit: 元/kWh
    source: "附件 1 列『电价』; global_symbols.yaml"
    observed_range: [0.3713, 1.3952]
    observed_mean: 0.7662
    time_series: "144 个时段，逐时段取附件 1，不得平滑或重采样"
  - symbol: load_t
    name: 时段 t 小区负载功率
    unit: kW
    source: "附件 1 列『小区负载』; global_symbols.yaml"
    observed_range: [3309.3934, 5958.9696]
  - symbol: pv_t
    name: 时段 t 光伏发电（预测）功率
    unit: kW
    source: "附件 1 列『光伏发电预测功率』; global_symbols.yaml"
    observed_range: [0.0, 7612.316]

derived:
  - symbol: Pbar
    name: 单时段充/放电能量上限
    value: 833.3333333333334
    unit: kWh
    expression: "Pbar = Pmax * dt"
    note: "同为大 M 的紧上界 M* = Pbar（formulation.md 3.4）"
  - symbol: round_trip_efficiency
    name: 并网点侧往返效率
    value: 0.81
    unit: "-"
    expression: "eta_ch * eta_dis"
  - symbol: price_min
    name: 电价下界（用于解析下界）
    value: 0.3713
    unit: 元/kWh
    source: "附件 1"
  - symbol: energy_deficit
    name: 全天净缺额
    value: 55541.9724
    unit: kWh
    expression: "sum_t (load_t - pv_t) * dt"
    source: "附件 1 只读探针"
  - symbol: pv_surplus_total
    name: 全天正余电
    value: 6247.963
    unit: kWh
    expression: "sum_t max(pv_t - load_t, 0) * dt"
    source: "附件 1 只读探针"
  - symbol: pv_surplus_max_period
    name: 单时段最大余电
    value: 352.92
    unit: kWh
    expression: "max_t max(pv_t - load_t, 0) * dt"
    source: "附件 1 只读探针"
  - symbol: deficit_max_period
    name: 单时段最大缺额
    value: 826.08
    unit: kWh
    expression: "max_t max(load_t - pv_t, 0) * dt"
    source: "附件 1 只读探针"

decision_variables:
  - symbol: q_t
    name: 时段 t 计划购电量
    unit: kWh
    lower: 0
    upper: .inf
    note: "只购不售；不设反送变量（asm-03）"
  - symbol: C_t
    name: 时段 t 充电量（并网点侧口径）
    unit: kWh
    lower: 0
    upper: Pbar
  - symbol: D_t
    name: 时段 t 放电量（并网点侧口径）
    unit: kWh
    lower: 0
    upper: Pbar
  - symbol: E_t
    name: 时段 t 末储电量
    unit: kWh
    lower: Emin
    upper: Emax
    initial: E0
  - symbol: curtail_t
    name: 时段 t 弃光量
    unit: kWh
    lower: 0
    upper: "pv_t * dt"
  - symbol: y_t
    name: 充放电互斥 0-1 指示
    unit: "-"
    domain: "{0, 1}"

constraints:
  - id: C1
    name: 时段能量平衡
    expression: "q_t + pv_t*dt + D_t - C_t - curtail_t = load_t*dt"
  - id: C2
    name: 储电量状态转移（并网点侧计量）
    expression: "E_t = E_{t-1} + eta_ch*C_t - D_t/eta_dis"
  - id: C3
    name: 储电量运行区间
    expression: "Emin <= E_t <= Emax"
  - id: C4
    name: 终端储电量条件
    expression: "E_144 = E_0 = 6000"
  - id: C5
    name: 变流器功率上限（折算为电量）
    expression: "0 <= C_t <= Pbar; 0 <= D_t <= Pbar"
  - id: C6
    name: 充放电互斥（big-M 线性化，M = Pbar）
    expression: "C_t <= Pbar*y_t; D_t <= Pbar*(1-y_t); y_t in {0,1}"
  - id: C7
    name: 购电量非负
    expression: "q_t >= 0"
  - id: C8
    name: 弃光非负且不超过可用光伏电量
    expression: "0 <= curtail_t <= pv_t*dt"

objective:
  expression: "min Cost_day = sum_t price_t * q_t"
  unit: 元
  excludes: "电池退化成本、循环惩罚、弃光惩罚、上网收益（asm-10, asm-03, D3）"

metrics:
  - symbol: Cost_day
    name: 全天购电费
    unit: 元
    role: primary
    analytic_lower_bound: 20622.7344
    feasible_upper_bound: 48052.0466
  - symbol: Q_day
    name: 全天购电量
    unit: kWh
    role: reported
    lower_bound: 55541.9724
    feasible_upper_bound: 61789.9354
  - symbol: curtail_total
    name: 全天弃光总量
    unit: kWh
    role: reported
    expected: "待 computation 验证 I3；若 >0 须给出时段与原因"
  - symbol: complementarity_violation
    name: 互斥违反量 max_t min(C_t, D_t)
    unit: kWh
    threshold: 1.0e-9
  - symbol: balance_residual
    name: 功率平衡最大残差
    unit: kWh
    threshold: 1.0e-6
  - symbol: soc_bound_residual
    name: 储电量边界与终端残差
    unit: kWh
    threshold: 1.0e-6

delivery_mapping:
  result_file: "result1.xlsx"
  plan_sheet:
    name: 计划购电量
    rule: "按行序一一对应：模板第 t 行 = 时段 t；交付时按物理区间标签『0:00-0:10 … 23:50-24:00』重写（asm-12，歧义 A9）"
    values: "q_t, t = 1..144"
  charge_sheet:
    name: 充放电量
    blocks: "0:00-4:00, 4:00-8:00, 8:00-12:00, 12:00-16:00, 16:00-20:00, 20:00-24:00"
    values: "sum_{t in T_b} C_t, sum_{t in T_b} D_t；E_0、E_144"
  paper_table_1:
    periods:
      "10:00-10:10": 61
      "12:00-12:10": 73
      "14:00-14:10": 85
      "16:00-16:10": 97
      "18:00-18:10": 109
      "20:00-20:10": 121
    totals: "Q_day, Cost_day"

solver_strategy:
  primary:
    model: M1_dayahead_milp
    method: "精确 MILP（分支定界）"
    library: "scipy.optimize.milp"
    backend: HiGHS
    required_scipy: ">=1.11"
    observed_scipy: "1.18.1"
    note: "pulp 未安装，不得依赖；无需外部求解器"
    reported_fields: ["status", "termination_reason", "objective", "best_bound", "mip_gap", "runtime_seconds", "num_variables", "num_constraints", "seed"]
  auxiliary:
    - model: M2_lp_relaxation
      role: "下界与退化诊断"
      constraint: "原始解可能出现 min(C_t,D_t)>0，不得作为交付的 C_t/D_t"
    - model: M4_battery_side_metering
      role: robustness 对照
      constraint: "与 asm-05 冲突，不得进入主模型"

acceptance_gates:
  pass:
    - "solver status 达到最优或给出可行 incumbent 且有 best bound/gap"
    - "互斥违反 <= 1e-9；平衡与 SOC 残差 <= 1e-6"
    - "Cost_day 落在 [20622.7344, 48052.0466]"
    - "E_0 = E_144 = 6000"
  pass_with_warning:
    - "有可行 incumbent 但未证明全局最优（mip_gap 缺失或超时）"
  fail:
    - "NaN/Inf"
    - "硬约束违反"
    - "单位或量纲错误"
    - "formulation 与实现不一致"
    - "原始数据被修改或追踪链缺失"

references:
  - id: ref-prob01-dayahead-silva-2020
    used_for: "日前调度 MILP 结构与功率平衡；curtailment 建模先例"
  - id: ref-prob01-complementarity-garifi-2020
    used_for: "充放电互补约束的排除与条件性松弛（条件不得默认成立）"
  - id: ref-prob01-complementarity-fortuny-1981
    used_for: "big-M 整数化依据"
  - id: ref-prob01-arbitrage-grimaldi-2024
    used_for: "恒定效率保持 LP/MILP；退化项影响量级"
  - id: ref-prob01-storage-luo-2015
    used_for: "效率与功率/容量的量级核对"
  - id: ref-prob01-tou-modu-2025
    used_for: "分时电价下充放时点为核心决策"
  - id: ref-prob01-rolling-palma-2013
    used_for: "静态日前与滚动重优化的信息结构区分"
  - id: ref-prob01-ieee1547-2018
    used_for: "并网接口规范背景（不决定是否允许反送）"

provenance:
  written_by: mathematical-formulator
  action_id: act-608c949a84f5432d
  stage: mathematical_formulation
  computed_full_instance: false
  probes:
    - "附件 1 只读结构/统计汇总"
    - "附件 5 result1.xlsx 只读结构核验"
    - "小规模 LP vs MILP 互斥性数值检查（非竞赛实例）"
  note: "本文件与 formulation.md、formula_validation.md 共同构成 formulation_v001 的 content_hash 输入"

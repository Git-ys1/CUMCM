# 期望输出（全部写入 output_directory）
expected_outputs:
  - file: raw/scenarios.jsonl
    note: 逐情景原始记录（参数覆盖、MILP/LP 状态、指标、残差、门禁、方向核验）。
  - file: raw/monte_carlo_samples.csv
    note: 200 次 ±5% 均匀乘性噪声的逐次样本（price/load/pv 因子、Cost_day、弃光、门禁）。
  - file: raw/equivalence_check.json
    note: I1 广义构造器 vs 已接受 build_model/evaluate_solution 的逐项等价性校验。
  - file: raw/series/
    note: A1/B1/B2 三个终端端点情景的储电量与充放电轨迹（出图用）。
  - file: summary.json
    note: 基线锚定、C1–C6 判据、方向核验、情景表、稳定性 verdict。
  - file: summary.csv
    note: 情景汇总表（Cost_day、Δ%、弃光、方向核验）。
  - file: ci.json
    note: 假设口径与参数包络、蒙特卡洛 95% 区间与 bootstrap 均值区间。
  - file: summary.md
    note: 人类可读汇总与后续聚合动作步骤。
  - file: figures/*.png
    note: 敏感性图（tornado、端点、效率/计量、组合压力、端点轨迹；MC 分布图在正式扫描中生成）。
  - file: figures/figure_index.json
    note: 图表登记片段，供聚合动作以 --register-figures 登记到题目 figure manifest。
  - file: solver_status.json
    note: 扫描级求解状态与 feasible_incumbent 标记（供 task_worker 判定）。
  - file: run_manifest.json
    note: 代码/接受实现/输入 sha256、情景数、MC 参数、版本、时限、gap、输出目录。

# 失败条件（任一触发即非零退出，按 failure_class 路由，不直接人工阻塞）
failure_conditions:
  - 附件 1 缺失、列名不符、行数≠144、NaN/Inf 或负值、时间标签不符右端点口径（异常 → code_runtime）
  - 基线锚定失败：|Cost_day - 35126.94858928963| > 1e-6 元（实现或环境变化 → code_runtime / harness_invariant）
  - 任一情景违反 C1 硬门禁（status≠0、残差超容差、互斥违反、NaN/Inf）（退出码 3 → quality_warning）
  - 输出目录与 --output 不一致（由 tasks.make_task_spec 在提交前拦截）


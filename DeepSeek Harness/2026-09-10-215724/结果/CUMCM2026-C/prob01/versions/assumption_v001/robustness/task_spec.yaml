# prob01 robustness 任务规格（由 robustness-analyst 编写）

# 预注册方案见同目录 plan.md（运行前写定，运行后不得修改）。
# task_id 由 tasks.compute_task_id 依据下列身份字段计算；本 spec 已通过
# scripts/compute_dispatcher.py submit 登记（attempt=1，status=queued，supervised worker）。

problem_id: CUMCM2026-C
question_id: prob01
stage: robustness
assumption_version: assumption_v001
formulation_version: formulation_v001

# 路径一律相对项目根；禁止绝对路径
working_directory: .
code_path: problems/CUMCM2026-C/prob01/versions/assumption_v001/robustness/prob01_robustness.py
input_path: data/附件1.xlsx
config_path: config/compute.yaml
output_directory: problems/CUMCM2026-C/prob01/versions/assumption_v001/robustness

command:
  - .venv/Scripts/python.exe
  - problems/CUMCM2026-C/prob01/versions/assumption_v001/robustness/prob01_robustness.py
  - --data
  - data/附件1.xlsx
  - --output
  - problems/CUMCM2026-C/prob01/versions/assumption_v001/robustness

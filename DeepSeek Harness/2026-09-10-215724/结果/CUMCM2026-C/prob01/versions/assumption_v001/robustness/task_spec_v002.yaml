# prob01 robustness 任务规格 v002（修复 attempt-001 路径缺陷后的正式重跑）

> 预注册方案仍为同目录 `plan.md`（**未修改**：情景矩阵、C1–C6 判据、阈值、方向预测、
> 判定规则与求解配置全部保持运行前写定的原样）。
> 本文件只登记**执行层**变更：输出目录与代码修复，原因是 attempt-001 的 worker 异常退出。

## 0. 为什么需要第二个任务规格

- attempt-001：`runtime/tasks/cd463874338e3f8a7f16`，status=`failed`、returncode=1、
  failure_type=`process_exit`、failure_class=`code_runtime`、`feasible_incumbent=true`。
- 根因（`attempt-001-stderr.log`）：43 个情景 + 200 次蒙特卡洛**全部完成**、
  `summary.*`/`ci.json`/`solver_status.json` 均已落盘后，`write_outputs()` 在写
  `run_manifest.json` 时执行 `out_root.relative_to(ROOT)`，而 `run_sweep` 传入的
  `out_root = Path(args.output)` 是**相对路径**，故抛 `ValueError: ... is not in the
  subpath of 'F:\...\AutoMM'`，`run_manifest.json` 未写出、进程以非零码结束。
- 该缺陷属纯执行层（路径）缺陷，不涉及模型、公式、数据或判据；但它使 attempt-001
  的产物链不完整（缺 `run_manifest.json`），按 `PROJECT.md`「按 failure_class 路由到
  重试/修订」与 `wiki/compute-tasks.md`「语法、依赖或进程退出：自动修复一次」处理。
- 修复后代码 hash 改变 → task_id 变化 → **新任务**；按 `wiki/recovery-stale.md`
  「失败重试使用新 attempt 和新输出目录」与 `task_worker.py` 的
  `.automm-output.lock`（同一结果目录只允许一个任务写入），本次使用新输出目录
  `robustness_v002/`。attempt-001 的全部残留（`robustness/`）**原样保留、未覆盖、未搬移**。

## 1. 代码修复（仅执行层，不改判据与情景）

`problems/CUMCM2026-C/prob01/versions/assumption_v001/robustness/prob01_robustness.py`：

1. 新增 `resolve_out_root(output)`：把 `--output` 统一解析为项目根下的绝对路径，
   并拒绝项目根之外的目录（语义同 `automm.common.resolve_project_path`）。
2. 新增 `output_rel(out_root)`：输出项目相对正斜杠路径。
3. `run_sweep` 与 `register_figures` 改用 `resolve_out_root(args.output)`
   （后者原先同样会在相对路径下崩溃，属同一缺陷在聚合路径上的潜伏实例）。
4. `generate_figures` 的 figure `path` 与 `source_data` 改为由实际输出目录派生
   （原为硬编码 `.../robustness/figures/...` 与 `.../robustness/summary.json`）。
5. `run_manifest.json` 的 `output_directory` 改用 `output_rel(out_root)`。

**未改动**：情景矩阵（43 情景 + 200 次 MC）、C1–C6 判据与阈值、方向预测、
`STABILITY`、`C2_SCENARIOS`、求解配置（`--time-limit 300`、`--mip-gap 1e-4`、
`scipy.optimize.milp`/HiGHS）、基线锚定常数、随机种子。

